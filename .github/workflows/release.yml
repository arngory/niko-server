name: Release

# vX.Y.Z: the end-to-end test, then niko-server-linux-{amd64,arm64} and
# SHA256SUMS on a GitHub release. raycontrol pins the tag and the hashes
# (deploy/versions.env, scripts/niko-server.sh).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.2). Created on the selected branch's head if it does not exist yet."
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve tag
        id: tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag $TAG is not vX.Y.Z"; exit 1
          fi
          # an existing tag must point at the commit being released
          if existing=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}"); then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::tag $TAG already exists on $existing, not on $GITHUB_SHA"; exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  test:
    needs: check
    uses: ./.github/workflows/ci.yml

  release:
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" \
              -o dist/niko-server-linux-$arch ./cmd/niko-server
          done
          cd dist && sha256sum niko-server-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          flags=(--title "$TAG" --prerelease --target "$GITHUB_SHA")
          if [ -f "docs/release-notes/$TAG.md" ]; then flags+=(--notes-file "docs/release-notes/$TAG.md"); fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* "${flags[@]}"
          fi
